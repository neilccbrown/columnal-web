column-name=The name used to refer to the column.
column-name.title=Column Name
column-name.full=Every column must have a name, and you cannot have duplicate column names within a single table.£££££Column names must start with a letter, optionally followed by a succession             of numbers, letters and spaces.  You cannot have adjacent spaces, nor spaces at the beginning or end.£££££
column-type=The type (e.g. number, text, date) of the values in the column.
column-type.title=Column Type
column-type.full=All the values in a column must have the same type, such as number, text or date.£££££Having all the values be of the same type avoids many errors in transformations, such as trying to multiply two text items together.£££££If you need a column to have multiple types, use a tagged type.£££££
column-defaultValue=The default value in the column when a new row is added.
column-defaultValue.title=Default Value
column-defaultValue.full=Values in columns cannot be absent, so a default value is required for when a new row is added.£££££If you want to have a "blank" value for a column, use a tagged type with a Blank tag.£££££
column-expression=This specifies the calculation of the column.
column-expression.title=Column Expression
column-expression.full=This is like a formula in a spreadsheet or mathematics.£££££
table-name=The name of the table being created.
table-name.title=Table Name
table-name.full=Every table must have a name, and tables may not share the same name.£££££Table names must start with a letter, optionally followed by a succession                 of numbers, letters and spaces.  You cannot have adjacent spaces, nor spaces at the beginning or end.£££££
