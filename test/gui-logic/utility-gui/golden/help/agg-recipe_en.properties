calc-column=This is the column used to compare to find the lowest/highest value.
calc-column.title=Column to compare
calc-column.full=£££££
result-column=This is the column that will actually be used as the result.  You can pick a different comparison and result column, for example if you want to compare prices for the lowest (price is the comparison column) but show the name of the lowest priced item (name is the result column).
result-column.title=Result column
result-column.full=If you want the lowest/highest value to be the result, use the same column for the calculation column and result column.£££££
