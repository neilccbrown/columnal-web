srctables=The tables to make available to the R expression.
srctables.title=Tables to pass to R
srctables.full=Only the tables listed here are available to the R expression.  Table names are automatically adjusted to be valid R names if needed, and are listed below.£££££
packages=The packages to import for use in the R expression.
packages.title=Packages to load in R
packages.full=These packages will be imported (and installed, if needed) for you.  List them here, separated by commas.£££££
expression=The R code to run and turn into a table.
expression.title=The R expression to run
expression.full=The R code can have multiple lines.  The last line will be turned into a Columnal table.£££££If it's a data frame it will be turned into a full table.  If it's a column or single value, it will be turned into a table with a single column.£££££R types will be converted to the most suitable Columnal types.  Note that numbers in Columnal may be more precise than in R.£££££
variables=The tables and columns that will be available in R
variables.title=Available R variables
variables.full=Based on the selected tables, this is a convenience list of available tables and columns in R.  You can click each one to insert it at the current cursor position in the R expression, rather than having to type them out yourself.£££££
